name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint and format check (Biome)
        run: pnpm exec biome ci
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Start local Supabase (applies migrations and seed)
        run: pnpm db:start

      - name: Export local Supabase settings for the app and tests
        run: |
          status=$(pnpm exec supabase status -o json)
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(jq -r .API_URL <<<"$status")"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(jq -r .PUBLISHABLE_KEY <<<"$status")"
            echo "SUPABASE_SECRET_KEY=$(jq -r .SECRET_KEY <<<"$status")"
            echo "MAILPIT_URL=$(jq -r .MAILPIT_URL <<<"$status")"
          } >> "$GITHUB_ENV"

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - run: pnpm build
      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
